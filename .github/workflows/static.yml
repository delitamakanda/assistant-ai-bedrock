name: Deploy gh-pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies and build
        run: |
          npm install
          npm run build -- --configuration production  --base-href "/${{ github.event.repository.name }}/"
          cp dist/assistant-ai/browser/index.html dist/assistant-ai/browser/404.html
          touch dist/assistant-ai/browser/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: dist/assistant-ai/browser
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
